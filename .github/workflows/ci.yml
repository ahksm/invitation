name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invite
          POSTGRES_PASSWORD: invite
          POSTGRES_DB: invite_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invite" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Дымовая проверка фронтенда в Chromium (test/e2e). Браузер ставится в кэш Playwright,
      # тест находит его сам; другой путь можно задать через PLAYWRIGHT_CHROMIUM.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
